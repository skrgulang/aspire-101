  <!-- Page logic -->
  <script type="module">
    import { getBrowserLocation, createPost, fetchNearbyPosts } from './geo.js';

    const supaURL  = document.querySelector('meta[name="supabase-url"]').content;
    const supaAnon = document.querySelector('meta[name="supabase-anon"]').content;
    const supabase = window.supabase.createClient(supaURL, supaAnon);

    const $ = s => document.querySelector(s);
    const feed = $("#feed");
    const guard = $("#guard");
    const compose = $("#compose");

    // Simple card renderer
    const esc = s => (s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function postCard(p){
      const div = document.createElement('div');
      div.className = "post";
      div.innerHTML = `
        ${p.image_url ? `<img src="${esc(p.image_url)}" alt="">` : ""}
        <div class="p-body">
          <strong>${esc(p.title || '')}</strong>
          <div class="muted" style="margin:4px 0 6px">${esc(p.city || '-')}${p.distance_km!=null ? ' · ' + Number(p.distance_km).toFixed(1) + ' km' : ''}</div>
          <p style="margin:0">${esc(p.body||'').replace(/\n/g,'<br>')}</p>
        </div>
      `;
      return div;
    }

    async function ensureAuth(){
      const { data: { user } } = await supabase.auth.getUser();
      if (!user){
        guard.style.display = 'block';
        compose.querySelector('button').disabled = true;
      }
      return user;
    }

    // Minimal uploader to Supabase Storage (bucket: post-images, Public)
    async function uploadPostImage(file){
      if (!file || !file.size) return null;
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) throw new Error('Please sign in');

      const bucket = supabase.storage.from('post-images'); // create this bucket (Public) in Supabase
      const path = `${user.id}/${Date.now()}_${file.name.replace(/\s+/g,'_')}`;

      const { error: upErr } = await bucket.upload(path, file, {
        cacheControl: '3600',
        upsert: true,
        contentType: file.type || 'image/jpeg'
      });
      if (upErr) throw upErr;

      const { data: pub } = bucket.getPublicUrl(path);
      return pub.publicUrl || null;
    }

    (async () => {
      const user = await ensureAuth();

      // Load nearby feed (works even if not signed in, just no compose)
      const coords = await getBrowserLocation().catch(()=>null);
      if (coords){
        const posts = await fetchNearbyPosts({ lat: coords.lat, lng: coords.lng, km: 100 }).catch(()=>[]);
        (posts || []).forEach(p => feed.appendChild(postCard(p)));
      }

      // Composer
      compose.addEventListener('submit', async (e)=>{
        e.preventDefault();
        if (!user) return alert("Please sign in first.");

        const fd = new FormData(compose);
        const title = fd.get('title')?.toString()?.trim();
        const body  = fd.get('body')?.toString()?.trim() || '';
        const city  = fd.get('city')?.toString()?.trim() || '';
        const imgFile = fd.get('image');

        let image_url = null;
        try{
          if (imgFile && imgFile.size) image_url = await uploadPostImage(imgFile);
        }catch(err){ console.error(err); alert('Image upload failed: ' + (err.message || err)); }

        let loc = await getBrowserLocation().catch(()=>null);

        // geo.js createPost({ title, body, city, image_url, lat, lng })
        const row = await createPost({
          title,
          body,
          city,
          image_url,
          lat:  loc?.lat,
          lng:  loc?.lng
        }).catch(err => { alert(err.message || err); return null; });

        if (row){
          feed.prepend(postCard(row));
          e.target.reset();
        }
      });
    })();
  </script>
