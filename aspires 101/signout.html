  <style>
    :root{color-scheme:light}
    body{font-family:system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
         margin:0;min-height:100svh;display:grid;place-items:center;background:#fafafa}
    .box{padding:20px 24px;border:1px solid #e5e7eb;border-radius:12px;background:#fff}
  </style>
</head>
<body>
  <div class="box">Signing you out…</div>

  <!-- Use ESM so we don't depend on window.supabase timing -->
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const url  = document.querySelector('meta[name="supabase-url"]').content;
    const anon = document.querySelector('meta[name="supabase-anon"]').content;
    const sb   = createClient(url, anon);

    // Try both scopes (covers all tabs/devices); ignore errors safely
    try { await sb.auth.signOut({ scope:'global' }); } catch {}
    try { await sb.auth.signOut({ scope:'local'  }); } catch {}

    // Clear local storage (extra safety in case you cached anything)
    try { localStorage.clear(); sessionStorage.clear(); } catch {}

    // Send them home
    location.replace('index.html');
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=index.html">
  </noscript>
</body>
</html>
