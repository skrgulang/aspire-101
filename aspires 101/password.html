<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Set new password · Aspire 101</title>

  <meta name="supabase-url"  content="https://ikxjemnugoodfuxjaqoe.supabase.co"/>
  <meta name="supabase-anon" content="YOUR-ANON-KEY"/>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="bg-grid">
  <main class="container section" style="max-width:520px">
    <h1 class="h1" style="text-align:left">Set a new password</h1>
    <div id="m" class="notice" style="display:none"></div>
    <div class="card" style="margin-top:16px">
      <form id="f" class="form">
        <div>
          <label class="label">New password</label>
          <input class="field" type="password" id="pw" minlength="6" required/>
        </div>
        <button class="btn primary" type="submit">Update</button>
      </form>
    </div>
  </main>

  <script>
    const $ = (s, el=document)=> el.querySelector(s);
    const supaURL  = document.querySelector('meta[name="supabase-url"]').content;
    const supaAnon = document.querySelector('meta[name="supabase-anon"]').content;
    const sb = window.supabase.createClient(supaURL, supaAnon);
    const m = $('#m');

    function flash(t,bad=false){ m.textContent=t; m.className='notice '+(bad?'bad':'ok'); m.style.display='block'; }

    // Supabase will bring a "access_token" in URL after user clicks the reset link
    document.getElementById('f').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const pw = $('#pw').value;
      if (!pw || pw.length < 6) return flash('Password must be at least 6 characters.', true);
      try{
        const { error } = await sb.auth.updateUser({ password: pw });
        if (error) throw error;
        flash('Updated! Redirecting to sign in…');
        setTimeout(()=> location.href='signin.html', 1000);
      }catch(err){
        flash(err.message || 'Failed to update password.', true);
      }
    });
  </script>
</body>
</html>
